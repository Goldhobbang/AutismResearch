name: Phase3 strict calibration smoke tests
on:
  push:
    paths:
      - 'experiments/phase3/experiment_d_calibration_strict.py'
      - 'tests/test_calibration_strict.py'
      - 'tests/test_physionet_session_matching.py'
      - 'tests/test_physionet_feature_names.py'
      - 'experiments/phase2/zero_shot_physionet.py'
      - 'experiments/phase3/physionet_multi_subject_audit.py'
      - 'data/processed/physionet/verified_segments.csv'
      - '.github/workflows/phase3-strict.yml'
  pull_request:
    paths:
      - 'experiments/phase3/experiment_d_calibration_strict.py'
      - 'tests/test_calibration_strict.py'
      - 'tests/test_physionet_session_matching.py'
      - 'tests/test_physionet_feature_names.py'
      - 'experiments/phase2/zero_shot_physionet.py'
      - 'experiments/phase3/physionet_multi_subject_audit.py'
      - 'data/processed/physionet/verified_segments.csv'
      - '.github/workflows/phase3-strict.yml'
jobs:
  synthetic-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install minimal test dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile Python scripts
        run: |
          python -m py_compile experiments/phase3/experiment_d_calibration_strict.py
          python -m py_compile experiments/phase3/integrate_strict_metrics.py
          python -m py_compile experiments/phase3/physionet_multi_subject_audit.py
      - name: Test synthetic protocol boundaries
        run: python -m unittest discover -s tests -p "test_calibration_strict.py" -v
      - name: Test PhysioNet manifest session matching
        run: python -m unittest discover -s tests -p "test_physionet_session_matching.py" -v
      - name: Test named-feature inference compatibility
        run: python -m unittest discover -s tests -p "test_physionet_feature_names.py" -v
