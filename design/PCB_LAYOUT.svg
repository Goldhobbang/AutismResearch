<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2b7086"/></marker></defs><rect width="100%" height="100%" fill="#f3f7fa"/><g font-family="sans-serif" fill="#153448"><text x="30" y="40" font-size="27" font-weight="bold">Proposed top / skin-contact / side arrangement</text><text x="30" y="70" font-size="16">Not to scale / no dimensions finalized / no PCB or enclosure built | Antenna clearance must follow selected module drawings</text><rect x="30" y="115" width="440" height="580" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="143" font-size="18" font-weight="bold">TOP — outward-facing</text><rect x="520" y="115" width="440" height="580" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="534" y="143" font-size="18" font-weight="bold">BOTTOM — skin-contact</text><rect x="1010" y="115" width="440" height="580" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="1024" y="143" font-size="18" font-weight="bold">SIDE — volume planning</text><rect x="50" y="165" width="400" height="85" rx="10" fill="#e4f3ee" stroke="#89adbd" stroke-width="2" stroke-dasharray="7 5"/><text x="64" y="193" font-size="18" font-weight="bold">BLE antenna keep-out</text><text x="64" y="219" font-size="15">No battery / metal / routing beneath or around</text><text x="64" y="242" font-size="15">follow manufacturer 3D clearance</text><rect x="60" y="280" width="220" height="120" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="74" y="308" font-size="18" font-weight="bold">ESP32-S3 module</text><text x="74" y="334" font-size="15">CPU + integrated memory</text><text x="74" y="357" font-size="15">Flash/PSRAM per variant</text><rect x="305" y="280" width="140" height="100" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="319" y="308" font-size="18" font-weight="bold">Power</text><text x="319" y="334" font-size="15">Rails + protection</text><text x="319" y="357" font-size="15">No duplicates</text><rect x="60" y="430" width="110" height="80" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="74" y="458" font-size="18" font-weight="bold">IMU</text><text x="74" y="484" font-size="15">Rigid support</text><rect x="195" y="430" width="245" height="80" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="209" y="458" font-size="18" font-weight="bold">Mic / Light</text><text x="209" y="484" font-size="15">Outward acoustic / light ports</text><rect x="60" y="545" width="180" height="90" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="74" y="573" font-size="18" font-weight="bold">EDA AFE</text><text x="74" y="599" font-size="15">Near electrode feed</text><text x="74" y="622" font-size="15">Quiet high-Z routing</text><rect x="270" y="545" width="170" height="90" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="284" y="573" font-size="18" font-weight="bold">DRV2605L</text><text x="284" y="599" font-size="15">Motor coupling check</text><text x="60" y="670" font-size="15">Battery footprint is constrained by side view.</text><rect x="545" y="200" width="170" height="90" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="559" y="228" font-size="18" font-weight="bold">Electrode A</text><text x="559" y="254" font-size="15">Skin contact</text><rect x="755" y="200" width="170" height="90" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="769" y="228" font-size="18" font-weight="bold">Electrode B</text><text x="769" y="254" font-size="15">Spacing not finalized</text><rect x="600" y="360" width="290" height="170" rx="10" fill="#edf6fa" stroke="#89adbd" stroke-width="2"/><text x="614" y="388" font-size="18" font-weight="bold">PPG optical window</text><text x="614" y="414" font-size="15">Open skin optical path</text><text x="614" y="437" font-size="15">LED/detector light isolation</text><text x="614" y="460" font-size="15">Seal / pressure / ambient rejection</text><text x="545" y="595" font-size="16">Skin-contact surface: comfort, sweat, motion,</text><text x="545" y="622" font-size="16">cleaning, heat and assent require validation.</text><text x="545" y="663" font-size="15">Do not place a battery across the optical path.</text><rect x="1035" y="175" width="110" height="120" rx="10" fill="#e4f3ee" stroke="#89adbd" stroke-width="2" stroke-dasharray="7 5"/><text x="1049" y="203" font-size="18" font-weight="bold">RF clear</text><text x="1049" y="229" font-size="15">Volume</text><text x="1049" y="252" font-size="15">No metal</text><text x="1170" y="205" font-size="15">Top shell: Mic / Light openings</text><rect x="1035" y="325" width="385" height="18" fill="#2c7a85"/><text x="1040" y="316" font-size="15">PCB / selected module placement</text><rect x="1090" y="380" width="165" height="115" rx="10" fill="#fff0d7" stroke="#89adbd" stroke-width="2"/><text x="1104" y="408" font-size="18" font-weight="bold">Battery zone</text><text x="1104" y="434" font-size="15">Off RF clearance</text><text x="1104" y="457" font-size="15">Off optical path</text><rect x="1290" y="365" width="115" height="170" rx="10" fill="#edf6fa" stroke="#89adbd" stroke-width="2"/><text x="1304" y="393" font-size="18" font-weight="bold">PPG path</text><text x="1304" y="419" font-size="15">Sensor</text><text x="1304" y="442" font-size="15">Window</text><text x="1304" y="465" font-size="15">Skin</text><path d="M1035,575 L1420,575" stroke="#9a6b57" stroke-width="5"/><text x="1050" y="605" font-size="15">Skin-facing shell / electrodes / optical seal</text><text x="1040" y="658" font-size="15">A flat battery-under-everything stack may fail.</text><text x="30" y="730" font-size="17">Haptic events may corrupt optical, electrode, IMU and acoustic signals: timestamp them and validate quality recovery.</text></g></svg>