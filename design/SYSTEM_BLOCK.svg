<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="840" viewBox="0 0 1450 840"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2b7086"/></marker></defs><rect width="100%" height="100%" fill="#f3f7fa"/><g font-family="sans-serif" fill="#153448"><text x="30" y="40" font-size="27" font-weight="bold">ESP32-S3 wrist system — BLE only</text><text x="30" y="70" font-size="16">Concept / not built | EDA alone uses EDA AFE | Mic + Light: context channels, predictive value unverified</text><rect x="30" y="125" width="175" height="75" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="153" font-size="18" font-weight="bold">EDA electrodes</text><text x="44" y="179" font-size="15">A / B skin contacts</text><rect x="245" y="125" width="225" height="75" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="259" y="153" font-size="18" font-weight="bold">EDA Analog Front-End</text><text x="259" y="179" font-size="15">Current limit / filter / calibrate</text><rect x="510" y="125" width="110" height="75" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="524" y="153" font-size="18" font-weight="bold">ADC</text><text x="524" y="179" font-size="15">MCU / ext.</text><path d="M205,162 L240,162" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M470,162 L505,162" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620,162 L675,162" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="265" width="300" height="82" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="293" font-size="18" font-weight="bold">PPG optical sensor</text><text x="44" y="319" font-size="15">LED / detector / AFE / FIFO</text><path d="M330,306 L675,306" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="294" font-size="15">I2C + IRQ</text><rect x="30" y="385" width="300" height="82" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="413" font-size="18" font-weight="bold">IMU</text><text x="44" y="439" font-size="15">3-axis ACC first</text><path d="M330,426 L675,426" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="414" font-size="15">I2C or SPI + IRQ</text><rect x="30" y="505" width="300" height="82" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="533" font-size="18" font-weight="bold">Digital Mic</text><text x="44" y="559" font-size="15">Volatile short audio frames</text><path d="M330,546 L675,546" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="534" font-size="15">I2S / supported PDM</text><rect x="30" y="625" width="300" height="82" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="44" y="653" font-size="18" font-weight="bold">Ambient Light</text><text x="44" y="679" font-size="15">Outward-facing light aperture</text><path d="M330,666 L675,666" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="654" font-size="15">I2C</text><rect x="680" y="105" width="365" height="630" rx="10" fill="#e6f1f6" stroke="#89adbd" stroke-width="2"/><text x="694" y="133" font-size="18" font-weight="bold">ESP32-S3 module</text><text x="694" y="159" font-size="15">Flash / PSRAM per selected SKU</text><text x="694" y="182" font-size="15">Native-rate acquisition + time sync</text><rect x="710" y="225" width="305" height="80" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="724" y="253" font-size="18" font-weight="bold">Signal Quality + Buffer</text><text x="724" y="279" font-size="15">Invalid / stale data =&gt; hold score</text><path d="M863,305 L863,333" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="340" width="305" height="80" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="724" y="368" font-size="18" font-weight="bold">Feature Extraction</text><text x="724" y="394" font-size="15">Past-only 60 s, update every15 s</text><path d="M863,420 L863,448" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="455" width="305" height="80" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="724" y="483" font-size="18" font-weight="bold">TinyML Inference</text><text x="724" y="509" font-size="15">LR first; NN is optional later</text><path d="M863,535 L863,565" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="575" width="305" height="100" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="724" y="603" font-size="18" font-weight="bold">Output Policy</text><text x="724" y="629" font-size="15">Quality gate / cooldown / freshness</text><text x="724" y="652" font-size="15">Uncalibrated research score</text><rect x="1110" y="150" width="305" height="85" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="1124" y="178" font-size="18" font-weight="bold">BLE Alert</text><text x="1124" y="204" font-size="15">Near guardian / teacher phone</text><path d="M1045,193 L1105,193" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1110" y="270" width="305" height="85" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="1124" y="298" font-size="18" font-weight="bold">Guardian / Teacher App</text><text x="1124" y="324" font-size="15">State / quality / review / context</text><path d="M1263,235 L1263,265" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1110" y="440" width="305" height="110" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="1124" y="468" font-size="18" font-weight="bold">Haptic output</text><text x="1124" y="494" font-size="15">DRV2605L -&gt; LRA / ERM</text><text x="1124" y="517" font-size="15">Child wrist haptic off by default</text><path d="M1045,495 L1105,495" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1110" y="625" width="305" height="110" rx="10" fill="white" stroke="#89adbd" stroke-width="2"/><text x="1124" y="653" font-size="18" font-weight="bold">Local Logging</text><text x="1124" y="679" font-size="15">Features / quality / score / events</text><text x="1124" y="702" font-size="15">Circular buffer; NO raw audio</text><path d="M1045,680 L1105,680" fill="none" stroke="#2b7086" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="790" font-size="17">Power / charging / protection / regulated rails serve all blocks; exact circuit, GPIO map and battery remain unverified.</text><text x="30" y="817" font-size="16">Current research: adult stress classification. ASD event warning and real 60 s lead time require separate data and validation.</text></g></svg>